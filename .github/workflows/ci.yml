name: Build and downloads
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish project tools (no official core or drivers) to Releases'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: downloads-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false
jobs:
  windows:
    name: Build, test and package
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check public file inventory
        run: python ./scripts/audit_public.py
      - name: Build, run regression, frontend and privacy tests, then package
        shell: powershell
        run: ./scripts/build.ps1 -Test -Package
      - name: Run the downloaded guide and check loose-tool guards
        shell: powershell
        run: ./scripts/test_download.ps1 -PackageDirectory ./artifacts/downloads
      - name: Upload reviewed download files
        id: download
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: LogiG304-Tools-Windows-x64
          path: |
            artifacts/downloads/LogiG304-Tools-Windows-x64.zip
            artifacts/downloads/LogiG304-Source.zip
            artifacts/downloads/SHA256SUMS.txt
            artifacts/downloads/release-notes.md
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Show download and package scope
        shell: pwsh
        env:
          DOWNLOAD_URL: ${{ steps.download.outputs.artifact-url }}
        run: |
          "## 自有辅助工具下载" >> $env:GITHUB_STEP_SUMMARY
          "[下载 Windows x64 工具包、对应源码与校验文件]($env:DOWNLOAD_URL)" >> $env:GITHUB_STEP_SUMMARY
          "此包不含官方核心、驱动或个人配置，不能作为全新电脑的 G304 完整安装器。使用说明随包提供。" >> $env:GITHUB_STEP_SUMMARY
  release:
    name: Publish public download
    needs: windows
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release && github.ref == 'refs/heads/main' && github.repository == 'Ktclat/LogiG304'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: LogiG304-Tools-Windows-x64
          path: download
          digest-mismatch: error
      - name: Check files and publish without replacing existing releases
        working-directory: download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          sha256sum --strict -c SHA256SUMS.txt
          tag="tools-${GITHUB_SHA:0:12}"
          gh release create "$tag" \
            LogiG304-Tools-Windows-x64.zip LogiG304-Source.zip SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "LogiG304 辅助工具 · ${GITHUB_SHA:0:12}（不含官方核心）" \
            --notes-file release-notes.md --latest
          echo "[打开公开下载页](https://github.com/$GH_REPO/releases/tag/$tag)" >> "$GITHUB_STEP_SUMMARY"
